[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bcr"
version = "0.1.0"
description = "Blender Colab Render - renderiza escenas de Blender en Google Colab"
license = {text = "MIT"}
requires-python = ">=3.10"

dependencies = [
    "requests>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-mock>=3",
    "google-api-python-client>=2",
    "google-auth>=2",
]
