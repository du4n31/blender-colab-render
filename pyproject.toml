[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "bcr"
version = "0.1.0"
description = "Blender Colab Render - renderiza escenas de Blender en Google Colab"
license = {text = "MIT"}
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-mock>=3",
]
